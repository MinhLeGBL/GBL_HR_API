name: Staging — Regression Test & Auto-Promote

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run all tests (full regression)
        run: pytest tests/ -x --ignore=tests/integration -v

  promote:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto-merge staging → deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin deployment
          git checkout deployment
          git merge origin/staging --ff-only -m "Auto-promote: staging tests passed"
          git push origin deployment
