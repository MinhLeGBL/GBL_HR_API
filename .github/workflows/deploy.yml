name: Deploy to Production

on:
  push:
    branches: [deployment]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/gbladmin/GBL_HR_API
          git pull origin deployment

      - name: Remove dev-only files from server
        run: |
          cd /home/gbladmin/GBL_HR_API
          rm -rf tests/ document/ docs/cr/

      - name: Install dependencies
        run: |
          cd /home/gbladmin/GBL_HR_API
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Restart service
        run: sudo systemctl restart gbl-hr-api

      - name: Health check
        run: |
          # This step MUST be able to fail the job. It previously ended with
          # `|| echo "WARNING: ..."`, so a dead API still reported a green
          # deploy — which is exactly how the 2026-09-16 outage went unnoticed.
          # Retry rather than a flat `sleep 5`: gunicorn needs a moment, and a
          # single early probe is both flaky and slow to catch a real failure.
          # Note the trailing slash. Flask 308-redirects /health to /health/,
          # and `curl -f` treats a 3xx as success — so the probe passed without
          # ever reaching the endpoint. A refused connection still failed it, so
          # this caught a dead API, but not one that boots and answers wrongly.
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:5000/api/v1/health/ >/dev/null 2>&1; then
              echo "Health check passed on attempt $i."
              exit 0
            fi
            echo "  attempt $i/12 — not up yet, retrying in 5s"
            sleep 5
          done
          echo "::error::API did not respond on localhost:5000 within 60s."
          echo "Recent service log:"
          journalctl -u gbl-hr-api -n 40 --no-pager || true
          exit 1
