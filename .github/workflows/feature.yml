name: Feature — Test

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run all tests
        run: pytest tests/ -x --ignore=tests/integration -v
        env:
          FLASK_ENV: testing
          PYTHONPATH: .
